name: Build Debian Trixie Package Directly

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parse-json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load JSON and Set Output
      id: set-matrix
      run: |
        JSON_DATA=$(jq -c . build-config.json)
        echo "matrix=${JSON_DATA}" >> $GITHUB_OUTPUT

  build-direct:
    needs: parse-json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.parse-json.outputs.matrix) }}

    name: Build package ${{ matrix.name }} directly

    steps:
    # Bước 0: Dọn dẹp ổ cứng máy ảo
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true      
        android: true         
        dotnet: true         
        haskell: true         
        swap: false           

    # Bước 1: Tải mã nguồn từ kho lưu trữ về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt công cụ đóng gói và thêm kho lưu trữ Debian Trixie mở rộng vào máy ảo host
    - name: Install dependencies and configure APT
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debian-archive-keyring debhelper devscripts jq equivs
        
        # Vô hiệu hóa tệp mirrorlist gây lỗi chuyển hướng URL cũ trên máy Actions
        sudo rm -f /etc/apt/apt-mirrors.txt
        sudo rm -f /etc/apt/sources.list.d/debian-trixie.list
        
        # Thêm kho chính thức Debian Trixie
        echo "deb http://debian.org trixie main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list.d/debian-trixie.list
        
        # Nếu là gói Backports (is_bp = 1), tự động thêm luôn kho backports vào máy ảo host
        if [ "${{ matrix.is_bp }}" -eq 1 ]; then
          echo "deb http://debian.org trixie-backports main contrib non-free non-free-firmware" | sudo tee -a /etc/apt/sources.list.d/debian-trixie.list
        fi
        
        # Cập nhật danh sách gói, cho phép bỏ qua xác thực GPG tạm thời trước khi chạy chroot_setup
        sudo apt-get update -o Dir::Etc::preferences=/dev/null \
                            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/debian-trixie.list \
                            -o Dir::Etc::sourceparts=/dev/null \
                            -o Acquire::AllowInsecureRepositories=true \
                            -o Acquire::AllowDowngradeToInsecureRepositories=true \
                            --allow-unauthenticated

    # Bước 3: Áp dụng cấu hình ghim phiên bản (APT Pinning) lấy từ file JSON trực tiếp lên máy ảo host
    - name: Apply APT Pinning Preferences
      run: |
        # Thực thi chuỗi câu lệnh chroot_setup (giờ là host_setup) của bạn trực tiếp bằng quyền sudo
        sudo sh -c "${{ matrix.chroot_setup }}"

    # Bước 4: Chạy hàm dch_version để cập nhật phiên bản động vào debian/changelog
    - name: Update Changelog Version
      env:
        TAG_VAL: ${{ matrix.v }}
        IS_BP_VAL: ${{ matrix.is_bp }}
      run: |
        dch_version() {
            local tag="${1:-v3}"
            local is_bp="${2:-0}"
            if [ ! -f "debian/changelog" ]; then return 1; fi
            local src_name=$(dpkg-parsechangelog -S Source)
            local local_changelog_ver=$(dpkg-parsechangelog -S Version)
            if [[ "$local_changelog_ver" == *bpo* ]]; then is_bp=1; fi
            local full_ver=""
            local apt_clean_opts=(-o "Dir::Etc::preferences=/dev/null" -o "Dir::Etc::preferencesparts=/dev/null" -o "Dir::Etc::sourceparts=/dev/null")
            local search_list="$src_name"
            local upstream_bins=$(apt-cache "${apt_clean_opts[@]}" showsrc "$src_name" 2>/dev/null | grep -E "^Binary:" | sed 's/Binary://g' | tr ',' ' ')
            [ -z "$upstream_bins" ] && [ -f "debian/control" ] && upstream_bins=$(awk '/^Package:/ {print $2}' debian/control)
            search_list="$search_list $upstream_bins"
            for bin in $search_list; do
                if [ "$is_bp" -eq 1 ]; then
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -E "backports|~bpo" | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                else
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                fi
                if [ -n "$full_ver" ] && [ "$full_ver" != "(none)" ]; then
                    if [[ "$full_ver" == *+b[0-9]* ]]; then break; fi
                    if [ "$bin" = "$src_name" ]; then local saved_ver="$full_ver"; fi
                fi
            done
            if [ -z "$full_ver" ] || [ "$full_ver" = "(none)" ]; then full_ver="${saved_ver:-$local_changelog_ver}"; fi
            local epoch=""
            local main_ver="$full_ver"
            if [[ "$full_ver" == *:* ]]; then epoch="${full_ver%%:*}:"; main_ver="${full_ver#*:}"; fi
            main_ver=$(echo "$main_ver" | sed -E 's/ct05v[0-9]+//g' | sed -E 's/ct05//g')
            local final_ver=""
            main_ver="${main_ver%[-+~]}"
            final_ver="${main_ver}+ct05${tag}"
            echo "${epoch}${final_ver}"
        }

        DYNAMIC_VERSION=$(dch_version "$TAG_VAL" "$IS_BP_VAL")
        echo "🔥 Phiên bản tính toán trực tiếp: $DYNAMIC_VERSION"
        DEBCHANGE_RELEASE_HEURISTIC=log dch --v "$DYNAMIC_VERSION" "Automated direct build for $TAG_VAL architecture level."

    # Bước 5: Tự động phân tích và cài đặt toàn bộ gói phụ thuộc biên dịch (Build-Depends) vào máy ảo
    - name: Install Package Build-Depends
      run: |
        # Lệnh này tự động đọc file debian/control và cài đặt mọi thư viện yêu cầu (như debhelper, cmake...)
        sudo mk-build-deps -i -r -t "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" debian/control

    # Bước 6: Tiến hành cấu hình cờ biên dịch từ JSON và build trực tiếp ra file .deb
    - name: Build Binary Package (.deb)
      env:
        DEB_BUILD_OPTIONS: ${{ matrix.DEB_BUILD_OPTIONS }}
        # Bạn có thể xuất thêm cờ tối ưu hóa kiến trúc vi xử lý x86-64-v3 ở đây nếu muốn
        DEB_CFLAGS_APPEND: "-march=x86-64-v3"
        DEB_CXXFLAGS_APPEND: "-march=x86-64-v3"
      run: |
        # Dọn dẹp file cũ ở thư mục cha
        rm -f ../*.dsc ../*.tar.* ../*.changes ../*.buildinfo ../*.deb
        
        # Biên dịch trực tiếp tạo cả gói Source và gói Binary (.deb thành phẩm)
        # Sử dụng cờ -us -uc để bỏ qua bước ký số GPG (Unsigned source, unsigned changelog)
        dpkg-buildpackage -b -us -uc

    # Bước 7: Thu gom thành phẩm
    - name: Prepare Artifacts Directory
      run: |
        mkdir -p dist-package
        cp ../*.deb dist-package/ 2>/dev/null || true
        cp ../*.changes dist-package/ 2>/dev/null || true
        cp ../*.buildinfo dist-package/ 2>/dev/null || true

    # Bước 8: Tải tệp thành phẩm .deb lên mục Artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ matrix.name }}
        path: dist-package/
