name: Build Debian Trixie Package with sbuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parse-json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load JSON and Set Output
      id: set-matrix
      run: |
        JSON_DATA=$(jq -c . build-config.json)
        echo "matrix=${JSON_DATA}" >> $GITHUB_OUTPUT

  sbuild-trixie:
    needs: parse-json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.parse-json.outputs.matrix) }}

    name: Build package ${{ matrix.name }}

    steps:
    # Bước 0: Dọn dẹp ổ cứng máy ảo
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true      
        android: true         
        dotnet: true         
        haskell: true         
        swap: false           

    # Bước 1: Tải mã nguồn từ kho lưu trữ về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt sbuild, công cụ đóng gói và ép cấu hình APT Trixie chuẩn
    - name: Install sbuild and dependencies
      run: |
        # 1. Cài đặt các công cụ cơ bản ban đầu
        sudo apt-get update
        sudo apt-get install -y sbuild mmdebstrap uidmap dpkg-dev debian-archive-keyring debhelper devscripts jq
        
        # 2. VÔ HIỆU HÓA MIRRORLIST: Xóa bỏ tệp cấu hình gây tự động chuyển hướng URL lỗi trên máy Actions
        sudo rm -f /etc/apt/apt-mirrors.txt
        sudo rm -f /etc/apt/sources.list.d/debian-trixie.list
        
        # 3. Ghi kho lưu trữ chuẩn với đường dẫn đầy đủ /debian (Tuyệt đối không dùng debian.org trống)
        echo "deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list.d/debian-trixie.list
        
        # 4. Thực thi cập nhật độc lập để hàm dch_version đọc dữ liệu mượt mà
        sudo apt-get update -o Dir::Etc::preferences=/dev/null \
                            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/debian-trixie.list \
                            -o Dir::Etc::sourceparts=/dev/null \
                            -o Acquire::AllowInsecureRepositories=true \
                            -o Acquire::AllowDowngradeToInsecureRepositories=true \
                            --allow-unauthenticated

    # Bước 3: Khởi tạo và lập chỉ mục Local APT Repository
    - name: Initialize Local APT Repository
      run: |
        mkdir -p pkgs
        cd pkgs
        touch Packages.gz
        dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
        cd ..

    # Bước 4: Cấu hình sbuild unshare và gán local repo động
    - name: Configure sbuild (unshare mode)
      run: |
        sudo sbuild-adduser $USER
        mkdir -p ~/.config/sbuild
        PKGS_DIR_PATH=$(pwd)/pkgs
        
        cat <<EOF > ~/.config/sbuild/config
        \$chroot_mode = 'unshare';
        \$build_environment = { 
          'LC_ALL' => 'C.UTF-8',
          'DEB_BUILD_OPTIONS' => '${{ matrix.DEB_BUILD_OPTIONS }}'
        };
        \$bwrap_mounts = [ [ '$PKGS_DIR_PATH', '/local-repo' ] ];
        \$apt_sources = [
            'deb [trusted=yes] file:///local-repo ./',
            'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware'
        ];
        EOF

    # Bước 5: Tải hoặc khởi tạo cache môi trường chroot
    - name: Cache sbuild chroot for Trixie
      id: cache-sbuild
      uses: actions/cache@v4
      with:
        path: ~/.cache/sbuild
        key: sbuild-chroot-trixie-amd64

    # Bước 6: Tạo môi trường chroot Debian Trixie (Chạy khi cache trống)
    - name: Create sbuild chroot for Debian Trixie
      if: steps.cache-sbuild.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.cache/sbuild
        touch ~/.dpkg.cfg && chmod 644 ~/.dpkg.cfg
        mmdebstrap --variant=buildd \
                   --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
                   trixie ~/.cache/sbuild/trixie-amd64.tar.gz

    # Bước 7: Dọn dẹp tệp cũ và gọi hàm dch_version để cập nhật changelog
    - name: Build Source Package
      env:
        TAG_VAL: ${{ matrix.v }}
        IS_BP_VAL: ${{ matrix.is_bp }}
      run: |
        rm -f ../*.dsc ../*.tar.* ../*.changes ../*.buildinfo ../*.deb

        dch_version() {
            local tag="${1:-v3}"
            local is_bp="${2:-0}"
            if [ ! -f "debian/changelog" ]; then return 1; fi
            local src_name=$(dpkg-parsechangelog -S Source)
            local local_changelog_ver=$(dpkg-parsechangelog -S Version)
            if [[ "$local_changelog_ver" == *bpo* ]]; then is_bp=1; fi
            local full_ver=""
            local apt_clean_opts=(-o "Dir::Etc::preferences=/dev/null" -o "Dir::Etc::preferencesparts=/dev/null" -o "Dir::Etc::sourceparts=/dev/null")
            local search_list="$src_name"
            local upstream_bins=$(apt-cache "${apt_clean_opts[@]}" showsrc "$src_name" 2>/dev/null | grep -E "^Binary:" | sed 's/Binary://g' | tr ',' ' ')
            [ -z "$upstream_bins" ] && [ -f "debian/control" ] && upstream_bins=$(awk '/^Package:/ {print $2}' debian/control)
            search_list="$search_list $upstream_bins"
            for bin in $search_list; do
                if [ "$is_bp" -eq 1 ]; then
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -E "backports|~bpo" | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                else
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                fi
                if [ -n "$full_ver" ] && [ "$full_ver" != "(none)" ]; then
                    if [[ "$full_ver" == *+b[0-9]* ]]; then break; fi
                    if [ "$bin" = "$src_name" ]; then local saved_ver="$full_ver"; fi
                fi
            done
            if [ -z "$full_ver" ] || [ "$full_ver" = "(none)" ]; then full_ver="${saved_ver:-$local_changelog_ver}"; fi
            local epoch=""
            local main_ver="$full_ver"
            if [[ "$full_ver" == *:* ]]; then epoch="${full_ver%%:*}:"; main_ver="${full_ver#*:}"; fi
            main_ver=$(echo "$main_ver" | sed -E 's/ct05v[0-9]+//g' | sed -E 's/ct05//g')
            local final_ver=""
            main_ver="${main_ver%[-+~]}"
            final_ver="${main_ver}+ct05${tag}"
            echo "${epoch}${final_ver}"
        }

        DYNAMIC_VERSION=$(dch_version "$TAG_VAL" "$IS_BP_VAL")
        echo "🔥 Phiên bản tự động tính toán: $DYNAMIC_VERSION"
        DEBCHANGE_RELEASE_HEURISTIC=log dch --v "$DYNAMIC_VERSION" "Automated build for $TAG_VAL architecture level."
        dpkg-buildpackage -S -us -uc -d

    # Bước 8: Biên dịch gói bằng sbuild kết hợp sinh câu lệnh gán Repo Backports tự động
    - name: Run sbuild for Trixie
      env:
        CHROOT_SETUP_JSON: ${{ matrix.chroot_setup }}
        IS_BP_VAL: ${{ matrix.is_bp }}
      run: |
        # 1. Đồng bộ cấu trúc Symlink bắt buộc cho sbuild unshare
        mkdir -p ~/.cache/sbuild
        ln -sf ~/.cache/sbuild/trixie-amd64.tar.gz ~/.cache/sbuild/trixie-amd64-sbuild.tar.gz
        
        # 2. Xây dựng chuỗi tham số --chroot-setup-commands động dựa theo trạng thái Backports ngoài shell cha
        export FINAL_SETUP_CMD="$CHROOT_SETUP_JSON"
        
        if [ "$IS_BP_VAL" -eq 1 ]; then
            BP_REPO_CMD="echo 'deb http://deb.debian.org/debian/ trixie-backports main contrib non-free non-free-firmware' > /etc/apt/sources.list.d/trixie-backports.list && apt-get update"
            export FINAL_SETUP_CMD="$FINAL_SETUP_CMD && $BP_REPO_CMD"
        fi
        
        # 3. SỬA TẠI ĐÂY: Dùng 'EOF' nháy đơn để bảo vệ chuỗi ký tự, ngăn chặn lỗi vỡ cấu trúc do ký tự \n gây ra
        cat << 'EOF' > execute_sbuild.sh
        #!/bin/bash
        # Gọi biến môi trường FINAL_SETUP_CMD đã được export một cách an toàn
        sbuild --dist=trixie \
               --arch=amd64 \
               --chroot-setup-commands="$FINAL_SETUP_CMD" \
               ../*.dsc
        EOF
        chmod +x execute_sbuild.sh
        
        # 4. Kích hoạt thực thi với đặc quyền nhóm sbuild
        sg sbuild -c './execute_sbuild.sh'

    # Bước 9: Thu gom thành phẩm
    - name: Prepare Artifacts Directory
      run: |
        mkdir -p dist-package
        cp ../*.deb dist-package/ 2>/dev/null || true
        cp ../*.changes dist-package/ 2>/dev/null || true
        cp ../*.buildinfo dist-package/ 2>/dev/null || true

    # Bước 10: Tải tệp thành phẩm lên mục Artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ matrix.name }}
        path: dist-package/
