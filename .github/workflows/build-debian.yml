name: Build Debian Trixie Package with sbuild (Unshare Mode)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parse-json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load JSON and Set Output
      id: set-matrix
      run: |
        JSON_DATA=$(jq -c . build-config.json)
        echo "matrix=${JSON_DATA}" >> $GITHUB_OUTPUT

  build-sbuild:
    needs: parse-json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.parse-json.outputs.matrix) }}

    name: Build package ${{ matrix.name }} via sbuild (Unshare)

    steps:
    # - name: Free Disk Space (Ubuntu)
    #   uses: jlumbroso/free-disk-space@v1.3.1
    #   with:
    #     tool-cache: true      
    #     android: true         
    #     dotnet: true         
    #     haskell: true         
    #     swap: false 

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install sbuild & mmdebstrap (Unshare Prerequisites)
      run: |
        sudo apt-get update
        sudo apt-get install -y sbuild mmdebstrap uidmap devscripts dpkg-dev debian-archive-keyring jq
        # Kích hoạt unprivileged user namespaces nếu cần thiết
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        # Thêm user vào nhóm sbuild để chạy sbuild không cần sudo
        sudo sbuild-adduser $USER

    - name: Create Base sbuild Chroot Tarball via mmdebstrap
      run: |
        mkdir -p $HOME/.cache/sbuild
        echo "🚀 Đang dựng hệ thống nền trixie-amd64.tar bằng mmdebstrap..."
        mmdebstrap --variant=buildd trixie $HOME/.cache/sbuild/trixie-amd64.tar http://deb.debian.org/debian

    - name: Setup Local Repository Structure
      run: |
        mkdir -p $HOME/local-repo
        touch $HOME/local-repo/Packages
        cd $HOME/local-repo && dpkg-scanpackages . /dev/null > Packages

    - name: Deploy Custom config.pl & Inject Dynamic Environment
      run: |
        mkdir -p $HOME/.config/sbuild
        
        # 1. Thiết lập cấu hình sbuild unshare nền tảng cơ bản
        cat << 'EOF' > $HOME/.config/sbuild/config.pl
        $chroot_mode = 'unshare';
        $build_dep_resolver = 'apt';
        $unshare_mmdebstrap_auto_create = 1; 
        $unshare_mmdebstrap_keep_tarball = 1;
        our $bindmounts = [ "$ENV{HOME}/local-repo:/local-repo" ];
        EOF

        # 2. Giải mã các tham số ma trận JSON ngay trên máy Host
        my_lto="${{ matrix.lto }}"
        my_v="${{ matrix.v }}"
        my_flag="${{ matrix.flag }}"
        
        if [ "$my_v" = "v3" ]; then
            march_flag="-march=x86-64-v3 -mtune=tigerlake -msha -maes -mpclmul -mrdrnd -mrdseed -mfsgsbase -mfxsr -mxsave -mxsaveopt -mxsavec -mxsaves -mclflushopt -mclwb -mshstk -mvaes -mvpclmulqdq -mgfni -mno-avx512f -mno-avx512vl -mno-avx512bw -mno-avx512dq -mno-avx512cd -mno-avx512ifma -mno-avx512vbmi -mno-avx512vbmi2 -mno-avx512vnni -mno-avx512bitalg -mno-avx512vpopcntdq -mno-avx512vp2intersect -mprefer-vector-width=256"
            rust_flags="-C target-cpu=x86-64-v3 -C llvm-args=-mcpu=tigerlake -C target-feature=+aes,+pclmulqdq,+rdrand,+rdseed,+fsgsbase,+fxsr,+xsave,+xsaveopt,+xsavec,+xsaves,+clflushopt,+clwb,+shstk,+vaes,+vpclmulqdq,+gfni,-avx512f,-avx512vl,-avx512bw,-avx512dq,-avx512cd,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq,-avx512vp2intersect"
        elif [ "$my_v" = "v4" ]; then
            march_flag="-march=native -mprefer-vector-width=512"
            rust_flags="-C target-cpu=native"
        else
            march_flag="-march=x86-64-$my_v -mtune=tigerlake"
            rust_flags="-C target-cpu=x86-64-$my_v -C llvm-args=-mcpu=tigerlake"
        fi

        if [ "$my_lto" = "1" ]; then
            opt_flags="-$my_flag $march_flag -flto=auto -fuse-linker-plugin"
            ld_flags="-Wl,-O1 -Wl,--as-needed -flto=auto"
            rust_flags="$rust_flags -C linker-plugin-lto"
            deb_maint_options="optimize=+lto"
        else
            opt_flags="-$my_flag $march_flag"
            ld_flags="-Wl,-O1 -Wl,--as-needed"
            deb_maint_options="optimize=-lto"
        fi

        # 3. 🌟 PHƯƠNG PHÁP FIX CHUẨN: Sử dụng cặp biến đặc quyền của Maintainer lồng ghép thẳng vào bộ lọc
        # Cấu hình này bảo toàn cờ hệ thống để tránh crash, đồng thời ép cờ tối ưu vào đuôi lệnh
        cat << EOF >> $HOME/.config/sbuild/config.pl
        \$build_environment = {
            'CFLAGS'                  => '$opt_flags',
            'CXXFLAGS'                => '$opt_flags',
            'LDFLAGS'                 => '$ld_flags',
            'DEB_CFLAGS_MAINT_APPEND' => '$opt_flags',
            'DEB_CXXFLAGS_MAINT_APPEND' => '$opt_flags',
            'DEB_LDFLAGS_MAINT_APPEND' => '$ld_flags',
            'RUSTFLAGS'               => '$rust_flags', 
            'DEB_BUILD_MAINT_OPTIONS' => '$deb_maint_options',
            'CMAKE_CXX_SCAN_FOR_MODULES' => "OFF",
        };
        EOF

        # Tích hợp DEB_BUILD_OPTIONS từ ma trận JSON
        BASE_BUILD_OPTS="${{ matrix.DEB_BUILD_OPTIONS }}"
        if [ -n "$BASE_BUILD_OPTS" ]; then
            echo "\$build_environment->{'DEB_BUILD_OPTIONS'} = '$BASE_BUILD_OPTS';" >> $HOME/.config/sbuild/config.pl
        fi
        if [ -n "${{ matrix.DEB_BUILD_PROFILES }}" ]; then
            echo "\$build_environment->{'DEB_BUILD_PROFILES'} = '"${{ matrix.DEB_BUILD_PROFILES }}"';" >> $HOME/.config/sbuild/config.pl
        fi

        # 4. Thiết lập danh mục Repo chuẩn cho Chroot qua Hook tĩnh
        cat << 'EOF' >> $HOME/.config/sbuild/config.pl
        our $chroot_setup_commands = [
            'printf "Package: *\nPin: origin \"\"\nPin-Priority: 1001\n" > /etc/apt/preferences.d/pin-glibc',
            'echo "deb http://deb.debian.org/debian trixie main non-free-firmware contrib non-free" > /etc/apt/sources.list.d/trixie.list',
            'echo "deb-src http://deb.debian.org/debian trixie main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/trixie.list',
            'echo "deb http://deb.debian.org/debian-security trixie-security main non-free-firmware contrib non-free" >> /etc/apt/sources.list.d/trixie.list',
            'echo "deb-src http://deb.debian.org/debian-security trixie-security main non-free-firmware contrib non-free" >> /etc/apt/sources.list.d/trixie.list',
        EOF

        if [ "${{ matrix.is_bp }}" = "1" ]; then
            cat << 'EOF' >> $HOME/.config/sbuild/config.pl
            'echo "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/bp-sources.list',
            'echo "deb-src http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/bp-sources.list',
        EOF
        fi

        EXTRA_REPOS_JOINED="${{ join(matrix.extra_repos, ' ') }}"
        if [ -n "$EXTRA_REPOS_JOINED" ]; then
            echo "            'echo \"$EXTRA_REPOS_JOINED\" > /etc/apt/sources.list.d/local-repo.list'," >> $HOME/.config/sbuild/config.pl
        else
            echo "            'echo \"deb [trusted=yes] file:///local-repo ./\" > /etc/apt/sources.list.d/local-repo.list'," >> $HOME/.config/sbuild/config.pl
        fi

        CHROOT_SETUP_CMD="${{ matrix.chroot_setup }}"
        if [ -n "$CHROOT_SETUP_CMD" ]; then
            CHROOT_SETUP_CMD_ESCAPED=$(echo "$CHROOT_SETUP_CMD" | sed "s/'/\\\\'/g")
            echo "            '$CHROOT_SETUP_CMD_ESCAPED'," >> $HOME/.config/sbuild/config.pl
        else
            echo "            'apt-get update'," >> $HOME/.config/sbuild/config.pl
        fi

        echo "];" >> $HOME/.config/sbuild/config.pl
        echo "1;" >> $HOME/.config/sbuild/config.pl

        echo "📸 KIỂM TRA FILE CẤU HÌNH SBUILD KHÔNG CÒN CỜ SET GÂY CRASH:"
        cat $HOME/.config/sbuild/config.pl

    - name: Download Source and Dynamic Versioning via Host/Apt
      run: |
        # 1. Khai báo kho chính và kho bảo mật chuẩn chỉnh của Trixie với cờ [trusted=yes]
        sudo sh -c 'cat << "EOF" > /etc/apt/sources.list.d/trixie-src.list
        deb [trusted=yes] http://deb.debian.org/debian trixie main non-free-firmware contrib non-free
        deb-src [trusted=yes] http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
        deb [trusted=yes] http://deb.debian.org/debian-security trixie-security main non-free-firmware contrib non-free
        deb-src [trusted=yes] http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
        EOF'

        # 2. Cập nhật lại cơ sở dữ liệu apt để nhận diện cấu trúc tệp nguồn mới
        sudo apt-get update
        
        # 3. Tạo không gian làm việc cô lập trên máy Host
        mkdir -p $GITHUB_WORKSPACE/debian-build-env && cd $GITHUB_WORKSPACE/debian-build-env
        
        # 4. Tải mã nguồn của gói (Ví dụ: bubblewrap) từ kho lưu trữ
        apt-get source ${{ matrix.source }}
        
        # 5. Xác định chính xác thư mục chứa mã nguồn vừa tải về
        DETECTED_DIR=""
        for d in */; do
            if [ -f "${d}debian/changelog" ]; then
                DETECTED_DIR="${d%/}"
                break
            fi
        done

        if [ -z "$DETECTED_DIR" ]; then
            echo "❌ Không tìm thấy thư mục đóng gói Debian chuẩn!" >&2
            exit 1
        fi

        # Extract tên gói và phiên bản gốc (Upstream Version) để ép chuẩn hóa tên thư mục cho dpkg-source
        UPSTREAM_VERSION=$(dpkg-parsechangelog -l "${DETECTED_DIR}/debian/changelog" -S Version | sed -E 's/^[0-9]+://' | cut -d'-' -f1 | cut -d'+' -f1)
        SRC_DIR="${{ matrix.source }}-${UPSTREAM_VERSION}"

        # Nếu tên thư mục thực tế không trùng với tên chuẩn, tiến hành đổi tên để tránh lỗi 'cannot stat directory'
        if [ "$DETECTED_DIR" != "$SRC_DIR" ]; then
            mv "$DETECTED_DIR" "$SRC_DIR"
        fi
        
        cd "$SRC_DIR"

        # Thuật toán tự động tính toán mã phiên bản kế thừa từ logic gốc của bạn
        dch_version() {
            local tag="${1:-v3}"
            local is_bp="${2:-0}"
            if [ ! -f "debian/changelog" ]; then return 1; fi
            local src_name=$(dpkg-parsechangelog -S Source)
            local local_changelog_ver=$(dpkg-parsechangelog -S Version)
            if [[ "$local_changelog_ver" == *bpo* ]]; then is_bp=1; fi
            local full_ver=""
            local apt_clean_opts=(-o "Dir::Etc::preferences=/dev/null" -o "Dir::Etc::preferencesparts=/dev/null" -o "Dir::Etc::sourceparts=/dev/null")
            local search_list="$src_name"
            
            # Sử dụng số phiên bản lấy từ changelog gốc làm mốc nền
            full_ver="$local_changelog_ver"
            
            local epoch=""
            local main_ver="$full_ver"
            if [[ "$full_ver" == *:* ]]; then epoch="${full_ver%%:*}:"; main_ver="${full_ver#*:}"; fi
            main_ver=$(echo "$main_ver" | sed -E 's/ct05v[0-9]+//g' | sed -E 's/ct05//g')
            local final_ver=""
            main_ver="${main_ver%[-+~]}"
            final_ver="${main_ver}+ct05${tag}"
            echo "${epoch}${final_ver}"
        }

        DYNAMIC_VERSION=$(dch_version "${{ matrix.v }}" "${{ matrix.is_bp }}")
        echo "🔥 Phiên bản tính toán từ kho Debian: $DYNAMIC_VERSION"
        
        export DEBEMAIL="cuongtran05@github.com"
        export DEBFULLNAME="Cường Trần"
        dch --force-bad-version --v "$DYNAMIC_VERSION" "Automated Debian unshare chroot rebuild for ${{ matrix.v }}."
        
        # 6. Khởi tạo và kết xuất ra file đặc tả .dsc mới một cách an toàn trên máy host
        cd $GITHUB_WORKSPACE/debian-build-env
        dpkg-source -b "$SRC_DIR"
        
        echo "📸 Kiểm tra các tệp tin nguồn đích thực tại workspace máy host:"
        ls -la $GITHUB_WORKSPACE/debian-build-env/

    - name: Build Package via sbuild (Unshare Native Mode)
      run: |
        cd $GITHUB_WORKSPACE/debian-build-env/
        DSC_FILE=$(ls *.dsc | head -n 1)
        
        if [ -z "$DSC_FILE" ]; then
            exit 1
        fi
        
        export SBUILD_TMPDIR="/tmp"

        # Khởi chạy sbuild kết hợp ép tham số biên dịch vào lệnh thực thi cốt lõi
        sbuild -d trixie \
          --chroot-mode=unshare \
          --build-dep-resolver=apt --no-run-lintian \
          --no-clean-source \
          --nolog \
          --debbuildopt="-us" \
          --debbuildopt="-uc" \
          --debbuildopt="--nocheck" \
          "$DSC_FILE"

    - name: Update Local Repository Index & Prepare Artifacts
      run: |
        TARGET_DIR="$GITHUB_WORKSPACE/dist-package/${{ matrix.name }}"
        mkdir -p "$TARGET_DIR"
        
        # Gom các file deb thành phẩm từ thư mục build
        cp $GITHUB_WORKSPACE/debian-build-env/*.deb "$TARGET_DIR/" 2>/dev/null || true
        
        # Cập nhật ngược lại vào kho nội bộ máy host phòng trường hợp các job sau cần phụ thuộc
        cp "$TARGET_DIR"/*.deb $HOME/local-repo/ 2>/dev/null || true
        cd $HOME/local-repo
        dpkg-scanpackages . /dev/null > Packages
        gzip -fk Packages

    - name: Upload Artifacts to GitHub Actions UX
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-${{ matrix.v }}-${{ matrix.flag }}
        path: dist-package/${{ matrix.name }}/
