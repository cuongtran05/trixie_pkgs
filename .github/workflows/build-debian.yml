name: Build Debian Trixie Package with sbuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parse-json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load JSON and Set Output
      id: set-matrix
      run: |
        JSON_DATA=$(jq -c . build-config.json)
        echo "matrix=${JSON_DATA}" >> $GITHUB_OUTPUT

  build-sbuild:
    needs: parse-json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.parse-json.outputs.matrix) }}

    name: Build package ${{ matrix.name }} via sbuild

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true      
        android: true         
        dotnet: true         
        haskell: true         
        swap: false           

    # Bước 1: Đồng bộ mã nguồn chứa tệp build-config.json từ nhánh Git
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bước 2: Cài đặt sbuild và các gói bổ trợ hệ thống cơ bản trên môi trường Host Ubuntu
    - name: Install sbuild on host
      run: |
        sudo apt-get update
        sudo apt-get install -y sbuild schroot debootstrap devscripts dpkg-dev debian-archive-keyring jq

        # Thêm tài khoản hiện tại vào nhóm đặc quyền sbuild
        sudo sbuild-adduser $USER

    # Bước 3: Tạo thư mục lưu trữ gói nội bộ phục vụ việc cài đặt chéo
    - name: Setup Local Repository Structure
      run: |
        sudo mkdir -p /local-repo
        sudo chown -R runner:docker /local-repo
        touch /local-repo/Packages
        cd /local-repo && dpkg-scanpackages . /dev/null > Packages

    # Bước 4: Tạo sbuild chroot (SỬA LỖI: Cập nhật URL gương chuẩn mã nguồn deb.debian.org)
    - name: Create sbuild chroot for Debian Trixie
      run: |
        sudo mkdir -p /scratch
        # Sử dụng đúng tên miền phân phối chính thức deb.debian.org để debootstrap tải tệp Release
        sudo sbuild-createchroot --make-sbuild-tarball=/var/lib/sbuild/trixie-amd64.tar.gz trixie /scratch http://deb.debian.org/debian

    # Bước 5: Tạo kịch bản nạp kho ứng dụng Debian và APT Pinning chạy sâu bên trong chroot
    - name: Configure Repository inside sbuild chroot
      run: |
        cat << 'EOF' > setup-chroot.sh
        #!/bin/sh
        # Thiết lập kho mã nguồn deb-src độc lập hoàn toàn với Ubuntu Host
        echo "deb-src http://deb.debian.org/debian trixie main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/debian-sources-src.list
        
        # Đăng ký thêm kho lưu trữ Backports nếu biến ma trận yêu cầu
        if [ "${{ matrix.is_bp }}" -eq 1 ]; then
          echo "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" >> /etc/apt/sources.list
          echo "deb-src http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/debian-sources-src.list
        fi

        # Mount kho phần mềm trung gian /local-repo từ môi trường ảo vào chroot
        echo "${{ matrix.extra_repos }}" > /etc/apt/sources.list.d/local-repo.list
        
        # Áp dụng cấu hình mức độ ưu tiên ghim phiên bản của bạn
        ${{ matrix.chroot_setup }}
        EOF
        chmod +x setup-chroot.sh

    # Bước 6: Gọi APT Source và tính toán phiên bản động trực tiếp BÊN TRONG chroot Debian biệt lập
    - name: Download Source and Dynamic Versioning via Debian Chroot
      run: |
        cat << 'EOF' > run-inside-chroot.sh
        #!/bin/bash
        set -e
        apt-get update
        
        # 1. Thực hiện tải mã nguồn gói từ kho Debian chính thức bằng biến matrix.source
        mkdir -p /tmp/src-download && cd /tmp/src-download
        apt-get source ${{ matrix.source }}
        
        # Định vị thư mục chứa mã nguồn vừa tải xuống và đồng bộ cấu trúc
        SRC_DIR=$(find . -maxdepth 2 -name "changelog" -exec dirname {} \; | exec dirname {} \;)
        cp -r /tmp/src-download/$SRC_DIR/* /build-workspace/
        cd /build-workspace

        # 2. Thuật toán phân tích phiên bản tự động từ tệp tin chỉ mục Debian
        dch_version() {
            local tag="${1:-v3}"
            local is_bp="${2:-0}"
            if [ ! -f "debian/changelog" ]; then return 1; fi
            local src_name=$(dpkg-parsechangelog -S Source)
            local local_changelog_ver=$(dpkg-parsechangelog -S Version)
            if [[ "$local_changelog_ver" == *bpo* ]]; then is_bp=1; fi
            local full_ver=""
            local apt_clean_opts=(-o "Dir::Etc::preferences=/dev/null" -o "Dir::Etc::preferencesparts=/dev/null" -o "Dir::Etc::sourceparts=/dev/null")
            local search_list="$src_name"
            local upstream_bins=$(apt-cache "${apt_clean_opts[@]}" showsrc "$src_name" 2>/dev/null | grep -E "^Binary:" | sed 's/Binary://g' | tr ',' ' ')
            [ -z "$upstream_bins" ] && [ -f "debian/control" ] && upstream_bins=$(awk '/^Package:/ {print $2}' debian/control)
            search_list="$search_list $upstream_bins"
            for bin in $search_list; do
                if [ "$is_bp" -eq 1 ]; then
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -E "backports|~bpo" | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                else
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                fi
                if [ -n "$full_ver" ] && [ "$full_ver" != "(none)" ]; then
                    if [[ "$full_ver" == *+b[0-9]* ]]; then break; fi
                    if [ "$bin" = "$src_name" ]; then local saved_ver="$full_ver"; fi
                fi
            done
            if [ -z "$full_ver" ] || [ "$full_ver" = "(none)" ]; then full_ver="${saved_ver:-$local_changelog_ver}"; fi
            local epoch=""
            local main_ver="$full_ver"
            if [[ "$full_ver" == *:* ]]; then epoch="${full_ver%%:*}:"; main_ver="${full_ver#*:}"; fi
            main_ver=$(echo "$main_ver" | sed -E 's/ct05v[0-9]+//g' | sed -E 's/ct05//g')
            local final_ver=""
            main_ver="${main_ver%[-+~]}"
            final_ver="${main_ver}+ct05${tag}"
            echo "${epoch}${final_ver}"
        }

        DYNAMIC_VERSION=$(dch_version "${{ matrix.v }}" "${{ matrix.is_bp }}")
        echo "🔥 Phiên bản định danh từ Debian Repo: $DYNAMIC_VERSION"
        DEBCHANGE_RELEASE_HEURISTIC=log dch --v "$DYNAMIC_VERSION" "Automated Debian chroot build for ${{ matrix.v }}."
        
        # 3. Biên dịch gói nguồn ra file .dsc trung gian
        dpkg-source -b .
        EOF
        chmod +x run-inside-chroot.sh

        # Xóa các tệp làm việc cũ trên Host để chuẩn bị nhận dữ liệu sạch từ chroot gửi ra
        find . -mindepth 1 -maxdepth 1 ! -name ".github" ! -name "build-config.json" ! -name "setup-chroot.sh" ! -name "run-inside-chroot.sh" -exec rm -rf {} +

        # Đẩy kịch bản vào chạy độc lập thông qua schroot Debian Trixie
        sudo schroot -c source:trixie-amd64-sbuild --directory=$GITHUB_WORKSPACE --bind=$GITHUB_WORKSPACE:/build-workspace /bin/bash ./run-inside-chroot.sh

    # Bước 7: Tiến hành ra lệnh cho sbuild biên dịch sạch gói phần mềm
    - name: Build Package via sbuild
      run: |
        DSC_FILE=$(ls ../*.dsc)
        
        # Xây dựng chuỗi cờ biên dịch March tối ưu hóa phần cứng từ cấu hình JSON
        BASE_FLAGS="-march=${{ matrix.v == 'v4' && 'x86-64-v4' || 'x86-64-v3' }} -${{ matrix.flag }}"
        if [ "${{ matrix.lto }}" -eq 1 ]; then
          BASE_FLAGS="$BASE_FLAGS -flto=auto"
        fi
        
        # Chạy tiến trình sbuild khép kín trong không gian tên nhóm 'sbuild'
        sg sbuild -c "sbuild -d trixie \
          --bindmounts=/local-repo \
          --chroot-setup-commands=\$(pwd)/setup-chroot.sh \
          --debbuildopt='-b -us -uc' \
          --env=DEB_BUILD_OPTIONS='${{ matrix.DEB_BUILD_OPTIONS }}' \
          --env=DEB_CFLAGS_APPEND='$BASE_FLAGS' \
          --env=DEB_CXXFLAGS_APPEND='$BASE_FLAGS' \
          \$DSC_FILE"

    # Bước 8: Thu gom tệp tin thay đổi .changes và tệp nhị phân .deb về kho chung
    - name: Update Local Repository Index & Prepare Artifacts
      run: |
        mkdir -p dist-package
        cp ../*.deb dist-package/ 2>/dev/null || true
        cp ../*.changes dist-package/ 2>/dev/null || true
        cp ../*.buildinfo dist-package/ 2>/dev/null || true
        
        cp ../*.deb /local-repo/ 2>/dev/null || true
        cd /local-repo
        dpkg-scanpackages . /dev/null > Packages
        gzip -fk Packages

    # Bước 9: Xuất thành phẩm lên kho lưu trữ Artifacts của GitHub Action
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-sbuild-package-${{ matrix.name }}
        path: dist-package/
