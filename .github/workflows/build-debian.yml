name: Build Debian Trixie Package with sbuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parse-json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load JSON and Set Output
      id: set-matrix
      run: |
        JSON_DATA=$(jq -c . build-config.json)
        echo "matrix=${JSON_DATA}" >> $GITHUB_OUTPUT

  build-sbuild:
    needs: parse-json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.parse-json.outputs.matrix) }}

    name: Build package ${{ matrix.name }} via sbuild

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true      
        android: true         
        dotnet: true         
        haskell: true         
        swap: false           

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install sbuild on host
      run: |
        sudo apt-get update
        sudo apt-get install -y sbuild schroot debootstrap devscripts dpkg-dev debian-archive-keyring jq
        sudo sbuild-adduser $USER

    - name: Setup Local Repository Structure
      run: |
        sudo mkdir -p /local-repo
        sudo chown -R runner:docker /local-repo
        touch /local-repo/Packages
        cd /local-repo && dpkg-scanpackages . /dev/null > Packages

    # Bước 4: Tạo sbuild chroot cho Debian Trixie (Đã sửa URL từ debian.org thành deb.debian.org)
    - name: Create sbuild chroot for Debian Trixie
      run: |
        sudo mkdir -p /scratch
        sudo sbuild-createchroot --make-sbuild-tarball=/var/lib/sbuild/trixie-amd64.tar.gz trixie /scratch http://deb.debian.org/debian

    - name: Configure Repository inside sbuild chroot
      run: |
        cat << 'EOF' > setup-chroot.sh
        #!/bin/sh
        echo "deb-src http://deb.debian.org/debian/ trixie main contrib non-free non-free-firmware" > /etc/apt/sources.list
        echo "deb http://deb.debian.org/debian/ trixie main non-free-firmware contrib non-free" >> /etc/apt/sources.list
        
        if [ "${{ matrix.is_bp }}" -eq 1 ]; then
          echo "deb http://deb.debian.org/debian/ trixie-backports main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/bp-sources.list
          echo "deb-src http://deb.debian.org/debian/ trixie-backports main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/bp-sources.list
        fi

        echo "${{ matrix.extra_repos }}" > /etc/apt/sources.list.d/local-repo.list
        ${{ matrix.chroot_setup }}
        EOF
        chmod +x setup-chroot.sh

    # Bước 6: Cô lập hoàn toàn luồng kéo mã nguồn và xử lý phiên bản trực tiếp trong Chroot Debian
    - name: Download Source and Dynamic Versioning via Debian Chroot
      run: |
        # 1. Tạo điểm mount ảo sẵn bên trong cấu trúc hệ thống của chroot
        sudo mkdir -p /scratch/build-workspace 2>/dev/null || true
        
        # 2. Sử dụng lệnh mount hệ thống để liên kết không gian lưu trữ hiện tại của Host vào Chroot
        sudo mount --bind $GITHUB_WORKSPACE /scratch/build-workspace

        # 3. Sử dụng đường ống dẫn (pipeline) truyền tập lệnh và thực thi trực tiếp bằng quyền schroot
        # Đã thay đổi định danh -c thành 'chroot:trixie-amd64-sbuild' để gọi trực tiếp phân vùng
        sudo schroot -c chroot:trixie-amd64-sbuild --directory=/tmp -- /bin/bash << 'EOF'
        set -e
        apt-get update
        
        # Tải mã nguồn sạch từ kho lưu trữ Debian chính thức
        mkdir -p /tmp/src-download && cd /tmp/src-download
        apt-get source ${{ matrix.source }}
        
        # Đồng bộ toàn bộ cây thư mục mã nguồn sang phân vùng làm việc chung đã mount chia sẻ
        SRC_DIR=$(find . -maxdepth 2 -name "changelog" -exec dirname {} \; | exec dirname {} \;)
        cp -r /tmp/src-download/$SRC_DIR/* /build-workspace/
        cd /build-workspace

        # Thuật toán tự động tính toán mã phiên bản từ kho lưu trữ Debian
        dch_version() {
            local tag="${1:-v3}"
            local is_bp="${2:-0}"
            if [ ! -f "debian/changelog" ]; then return 1; fi
            local src_name=$(dpkg-parsechangelog -S Source)
            local local_changelog_ver=$(dpkg-parsechangelog -S Version)
            if [[ "$local_changelog_ver" == *bpo* ]]; then is_bp=1; fi
            local full_ver=""
            local apt_clean_opts=(-o "Dir::Etc::preferences=/dev/null" -o "Dir::Etc::preferencesparts=/dev/null" -o "Dir::Etc::sourceparts=/dev/null")
            local search_list="$src_name"
            local upstream_bins=$(apt-cache "${apt_clean_opts[@]}" showsrc "$src_name" 2>/dev/null | grep -E "^Binary:" | sed 's/Binary://g' | tr ',' ' ')
            [ -z "$upstream_bins" ] && [ -f "debian/control" ] && upstream_bins=$(awk '/^Package:/ {print $2}' debian/control)
            search_list="$search_list $upstream_bins"
            for bin in $search_list; do
                if [ "$is_bp" -eq 1 ]; then
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -E "backports|~bpo" | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                else
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                fi
                if [ -n "$full_ver" ] && [ "$full_ver" != "(none)" ]; then
                    if [[ "$full_ver" == *+b[0-9]* ]]; then break; fi
                    if [ "$bin" = "$src_name" ]; then local saved_ver="$full_ver"; fi
                fi
            done
            if [ -z "$full_ver" ] || [ "$full_ver" = "(none)" ]; then full_ver="${saved_ver:-$local_changelog_ver}"; fi
            local epoch=""
            local main_ver="$full_ver"
            if [[ "$full_ver" == *:* ]]; then epoch="${full_ver%%:*}:"; main_ver="${full_ver#*:}"; fi
            main_ver=$(echo "$main_ver" | sed -E 's/ct05v[0-9]+//g' | sed -E 's/ct05//g')
            local final_ver=""
            main_ver="${main_ver%[-+~]}"
            final_ver="${main_ver}+ct05${tag}"
            echo "${epoch}${final_ver}"
        }

        DYNAMIC_VERSION=$(dch_version "${{ matrix.v }}" "${{ matrix.is_bp }}")
        echo "🔥 Phiên bản tính toán từ kho Debian: $DYNAMIC_VERSION"
        DEBCHANGE_RELEASE_HEURISTIC=log dch --v "$DYNAMIC_VERSION" "Automated Debian chroot build for ${{ matrix.v }}."
        
        # Đóng gói tạo tệp mô tả mã nguồn gốc đầu vào (.dsc)
        dpkg-source -b .
        EOF
        
        # 4. Giải phóng phân vùng (Umount) sau khi trích xuất hoàn tất nhằm trả lại trạng thái sạch cho sbuild
        sudo umount -l /scratch/build-workspace

    - name: Build Package via sbuild
      run: |
        DSC_FILE=$(ls ../*.dsc)
        BASE_FLAGS="-march=${{ matrix.v == 'v4' && 'x86-64-v4' || 'x86-64-v3' }} -${{ matrix.flag }}"
        if [ "${{ matrix.lto }}" -eq 1 ]; then
          BASE_FLAGS="$BASE_FLAGS -flto=auto"
        fi
        
        sg sbuild -c "sbuild -d trixie \
          --bindmounts=/local-repo \
          --chroot-setup-commands=\$(pwd)/setup-chroot.sh \
          --debbuildopt='-b -us -uc' \
          --env=DEB_BUILD_OPTIONS='${{ matrix.DEB_BUILD_OPTIONS }}' \
          --env=DEB_CFLAGS_APPEND='$BASE_FLAGS' \
          --env=DEB_CXXFLAGS_APPEND='$BASE_FLAGS' \
          \$DSC_FILE"

    - name: Update Local Repository Index & Prepare Artifacts
      run: |
        mkdir -p dist-package
        cp ../*.deb dist-package/ 2>/dev/null || true
        cp ../*.changes dist-package/ 2>/dev/null || true
        cp ../*.buildinfo dist-package/ 2>/dev/null || true
        
        cp ../*.deb /local-repo/ 2>/dev/null || true
        cd /local-repo
        dpkg-scanpackages . /dev/null > Packages
        gzip -fk Packages

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-sbuild-package-${{ matrix.name }}
        path: dist-package/
