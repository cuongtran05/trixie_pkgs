name: Build Debian Trixie Package with sbuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  parse-json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load JSON and Set Output
      id: set-matrix
      run: |
        JSON_DATA=$(jq -c . build-config.json)
        echo "matrix=${JSON_DATA}" >> $GITHUB_OUTPUT

  build-sbuild:
    needs: parse-json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.parse-json.outputs.matrix) }}

    name: Build package ${{ matrix.name }} via sbuild

    steps:
    # - name: Free Disk Space (Ubuntu)
    #   uses: jlumbroso/free-disk-space@v1.3.1
    #   with:
    #     tool-cache: true      
    #     android: true         
    #     dotnet: true         
    #     haskell: true         
    #     swap: false           

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install sbuild on host
      run: |
        sudo apt-get update
        sudo apt-get install -y sbuild schroot debootstrap devscripts dpkg-dev debian-archive-keyring jq
        sudo sbuild-adduser $USER

    - name: Setup Local Repository Structure
      run: |
        sudo mkdir -p /local-repo
        sudo chown -R runner:docker /local-repo
        touch /local-repo/Packages
        cd /local-repo && dpkg-scanpackages . /dev/null > Packages

    # Bước 4: Tạo sbuild chroot cho Debian Trixie (Đã sửa URL từ debian.org thành deb.debian.org)
    - name: Create sbuild chroot for Debian Trixie
      run: |
        sudo mkdir -p /scratch
        # sudo sbuild-createchroot --make-sbuild-tarball=/var/lib/sbuild/trixie-amd64.tar.gz trixie /scratch http://deb.debian.org/debian
        sudo sbuild-createchroot trixie /scratch http://deb.debian.org/debian

    # Bước cấu hình: Khởi tạo các hook lệnh bằng cơ chế bảo vệ biến môi trường
    - name: Configure Repository inside sbuild chroot
      env:
        MATRIX_EXTRA_REPOS: ${{ join(matrix.extra_repos, ' ') }}
        MATRIX_CHROOT_SETUP: ${{ matrix.chroot_setup }}
      run: |
        cat << 'EOF' > setup-chroot.sh
        #!/bin/sh
        set -e
        
        # 1. Ghi đè kho lưu trữ Debian Trixie sạch dạng tệp độc lập bảo vệ hệ thống
        echo "deb http://deb.debian.org/debian/ trixie main non-free-firmware contrib non-free" > /etc/apt/sources.list.d/trixie.list
        echo "deb-src http://deb.debian.org/debian/ trixie main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/trixie.list
        
        # 2. Thêm kho lưu trữ Backports nếu ma trận yêu cầu
        if [ "${{ matrix.is_bp }}" -eq 1 ]; then
          echo "deb http://deb.debian.org/debian/ trixie-backports main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/bp-sources.list
          echo "deb-src http://deb.debian.org/debian/ trixie-backports main contrib non-free non-free-firmware" >> /etc/apt/sources.list.d/bp-sources.list
        fi

        # 3. Ghi kho lưu trữ nội bộ an toàn tuyệt đối nhờ biến môi trường (bảo vệ dấu ngoặc vuông [])
        if [ -n "$MATRIX_EXTRA_REPOS" ]; then
          echo "$MATRIX_EXTRA_REPOS" > /etc/apt/sources.list.d/local-repo.list
        else
          echo "deb [trusted=yes] file:///local-repo ./" > /etc/apt/sources.list.d/local-repo.list
        fi
        
        # 4. Thực thi các lệnh tùy chỉnh nâng cao (Pin gói, update apt,...) từ file json
        if [ -n "$MATRIX_CHROOT_SETUP" ]; then
          eval "$MATRIX_CHROOT_SETUP"
        fi
        EOF
        
        chmod +x setup-chroot.sh
        echo "📸 Kiểm tra nội dung tệp setup-chroot.sh vừa tạo để đảm bảo không lỗi cú pháp:"
        cat setup-chroot.sh

    # Bước 6: Tải mã nguồn, xử lý phiên bản và trích xuất vật lý file .dsc ra ngoài máy host
    - name: Download Source and Dynamic Versioning via Debian Chroot
      run: |
        # Thực thi quy trình trong phiên chroot để tải mã nguồn chuẩn từ kho Debian
        sudo schroot -c chroot:trixie-amd64-sbuild --directory=/tmp -- /bin/bash << 'EOF' > output_env.tar
        set -e
        chmod 1777 /tmp
        chown -R _apt:root /var/lib/apt/lists/
        
        # Kích hoạt kho deb-src bên trong chroot
        sudo sed -i 's/^#\s*deb-src/deb-src/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        
        apt-get update >/dev/null
        apt-get install -y devscripts dpkg-dev >/dev/null
        
        # Tạo thư mục làm việc nội bộ bên trong chroot
        mkdir -p /tmp/debian-build-env && cd /tmp/debian-build-env
        
        # Tải trực tiếp mã nguồn sạch của chính gói bubblewrap từ kho Debian
        apt-get source ${{ matrix.source }} >/dev/null
        
        # Xác định chính xác thư mục chứa mã nguồn bubblewrap vừa tải
        SRC_DIR=""
        for d in */; do
            if [ -f "${d}debian/changelog" ]; then
                SRC_DIR="${d%/}"
                break
            fi
        done

        if [ -z "$SRC_DIR" ]; then
            echo "❌ Không tìm thấy thư mục đóng gói Debian chuẩn!" >&2
            exit 1
        fi
        
        cd "$SRC_DIR"

        # Thuật toán tự động tính toán mã phiên bản từ kho lưu trữ Debian
        dch_version() {
            local tag="${1:-v3}"
            local is_bp="${2:-0}"
            if [ ! -f "debian/changelog" ]; then return 1; fi
            local src_name=$(dpkg-parsechangelog -S Source)
            local local_changelog_ver=$(dpkg-parsechangelog -S Version)
            if [[ "$local_changelog_ver" == *bpo* ]]; then is_bp=1; fi
            local full_ver=""
            local apt_clean_opts=(-o "Dir::Etc::preferences=/dev/null" -o "Dir::Etc::preferencesparts=/dev/null" -o "Dir::Etc::sourceparts=/dev/null")
            local search_list="$src_name"
            local upstream_bins=$(apt-cache "${apt_clean_opts[@]}" showsrc "$src_name" 2>/dev/null | grep -E "^Binary:" | sed 's/Binary://g' | tr ',' ' ')
            [ -z "$upstream_bins" ] && [ -f "debian/control" ] && upstream_bins=$(awk '/^Package:/ {print $2}' debian/control)
            search_list="$search_list $upstream_bins"
            for bin in $search_list; do
                if [ "$is_bp" -eq 1 ]; then
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -E "backports|~bpo" | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                else
                    full_ver=$(apt-cache "${apt_clean_opts[@]}" madison "$bin" 2>/dev/null | grep -v -E "file:|ct05" | head -n 1 | awk -F'|' '{print $2}' | tr -d ' ')
                fi
                if [ -n "$full_ver" ] && [ "$full_ver" != "(none)" ]; then
                    if [[ "$full_ver" == *+b[0-9]* ]]; then break; fi
                    if [ "$bin" = "$src_name" ]; then local saved_ver="$full_ver"; fi
                fi
            done
            if [ -z "$full_ver" ] || [ "$full_ver" = "(none)" ]; then full_ver="${saved_ver:-$local_changelog_ver}"; fi
            local epoch=""
            local main_ver="$full_ver"
            if [[ "$full_ver" == *:* ]]; then epoch="${full_ver%%:*}:"; main_ver="${full_ver#*:}"; fi
            main_ver=$(echo "$main_ver" | sed -E 's/ct05v[0-9]+//g' | sed -E 's/ct05//g')
            local final_ver=""
            main_ver="${main_ver%[-+~]}"
            final_ver="${main_ver}+ct05${tag}"
            echo "${epoch}${final_ver}"
        }

        DYNAMIC_VERSION=$(dch_version "${{ matrix.v }}" "${{ matrix.is_bp }}")
        echo "🔥 Phiên bản tính toán từ kho Debian: $DYNAMIC_VERSION" >&2
        
        # Cập nhật nhật ký phiên bản chính thức của gói bubblewrap
        export DEBEMAIL="cuongtran05@github.com"
        export DEBFULLNAME="Cường Trần"
        dch --force-bad-version --v "$DYNAMIC_VERSION" "Automated Debian chroot rebuild for ${{ matrix.v }}." >/dev/null 2>&1
        
        # Quay trở lại thư mục cha và sinh lại tệp .dsc chính chủ được cập nhật số phiên bản mới
        cd /tmp/debian-build-env
        dpkg-source -b "$SRC_DIR" >/dev/null 2>&1
        
        # Đóng gói toàn bộ kết quả xuất ra STDOUT
        tar -cf - .
        EOF

        # 2. Xử lý giải nén file tar thu được ngay trên máy host
        tar -xf output_env.tar -C $GITHUB_WORKSPACE/
        rm -f output_env.tar
        
        # Cấp lại quyền sở hữu tệp tin cho user runner của GitHub Actions để sbuild có toàn quyền đọc
        sudo chown -R runner:docker ./
        echo "📸 Kiểm tra các tệp tin nguồn đích thực của gói bubblewrap tại máy host:"
        ls -la

    # Bước 7: Tiến hành sbuild biên dịch gói sạch sẽ
    - name: Build Package via sbuild
      run: |
        # Thiết lập các cờ tối ưu hóa kiến trúc phần cứng (Compiler Flags) từ matrix
        BASE_FLAGS="-march=${{ matrix.v == 'v4' && 'x86-64-v4' || 'x86-64-v3' }} -${{ matrix.flag }}"
        if [ "${{ matrix.lto }}" -eq 1 ]; then
          BASE_FLAGS="$BASE_FLAGS -flto=auto"
        fi

        # Xuất các biến môi trường trực tiếp ra máy host để sbuild tự động kế thừa vào chroot
        export DEB_BUILD_OPTIONS="${{ matrix.DEB_BUILD_OPTIONS }}"
        export DEB_BUILD_PROFILES="${{ matrix.DEB_BUILD_PROFILES }}"
        export DEB_CFLAGS_APPEND="$BASE_FLAGS"
        export DEB_CXXFLAGS_APPEND="$BASE_FLAGS"

        # Cấu hình các hook hành động ổn định thông qua .sbuildrc của Perl theo chuẩn sbuild core
        mkdir -p $HOME
        cat << 'PERL' > $HOME/.sbuildrc
        our $bindmounts = [ '/local-repo' ];
        our $chroot_setup_commands = [
            'printf "Package: *\nPin: origin \"\"\nPin-Priority: 1001\n" > /etc/apt/preferences.d/pin-glibc',
            '/bin/bash ' . qx(pwd | tr -d '\n') . '/setup-chroot.sh'
        ];
        our $environment_filter = [
            'PATH', 'DEB_BUILD_OPTIONS', 'DEB_BUILD_PROFILES', 
            'DEB_CFLAGS_APPEND', 'DEB_CXXFLAGS_APPEND'
        ];
        1;
        PERL

        # Tạo một thư mục build độc lập và cấp quyền sở hữu hoàn toàn cho nhóm sbuild
        sudo mkdir -p /tmp/sbuild-workspace
        sudo cp bubblewrap_* /tmp/sbuild-workspace/
        
        # Cấp quyền đọc ghi tối đa cho hệ thống apt sandbox nội bộ (_apt)
        sudo chmod -R 777 /tmp/sbuild-workspace
        sudo chown -R runner:sbuild /tmp/sbuild-workspace

        # Sử dụng Here-Doc << 'EOF' để thực thi lệnh sbuild bên trong thư mục cô lập
        sg sbuild << 'EOF'
        set -e
        
        # Di chuyển vào không gian làm việc an toàn đã cấu hình phân quyền đầy đủ
        cd /tmp/sbuild-workspace
        
        # Tìm chính xác tệp .dsc chứa chuỗi danh tính ct05v theo đúng yêu cầu của bạn
        DSC_FILE=$(ls *ct05v*.dsc | head -n 1)
        
        if [ -z "$DSC_FILE" ]; then
            echo "❌ Không tìm thấy tệp .dsc tùy chỉnh chứa chuỗi ct05v!"
            exit 1
        fi
        
        echo "🚀 Tiến hành biên dịch tệp nguồn sbuild tại không gian an toàn: /tmp/sbuild-workspace/$DSC_FILE"

        # Lược bỏ hoàn toàn các cờ phân loại gói -b/-B/-A để sbuild tự vận hành cờ mặc định sạch sẽ
        # Chỉ giữ lại duy nhất hai tùy chọn tắt ký số không gian nguồn
        sbuild -d trixie \
          --chroot-mode=schroot \
          --build-dep-resolver=apt \
          --nolog \
          --debbuildopt="-us" \
          --debbuildopt="-uc" \
          $DSC_FILE

        # Đảm bảo copy toàn bộ thành phẩm từ thư mục tạm /tmp/sbuild-workspace về thẳng root workspace của Host
        cp /tmp/sbuild-workspace/*.deb /tmp/sbuild-workspace/*.changes /tmp/sbuild-workspace/*.buildinfo $GITHUB_WORKSPACE/ 2>/dev/null || true
        EOF

    - name: Update Local Repository Index & Prepare Artifacts
      run: |
        mkdir -p dist-package
        # Gom các file từ root workspace vào thư mục dist-package để chuẩn bị upload
        cp $GITHUB_WORKSPACE/*.deb $GITHUB_WORKSPACE/*.changes $GITHUB_WORKSPACE/*.buildinfo dist-package/ 2>/dev/null || true
        
        # Đồng bộ vào kho lưu trữ nội bộ hệ thống như ban đầu
        sudo cp dist-package/*.deb /local-repo/ 2>/dev/null || true
        cd /local-repo
        sudo dpkg-scanpackages . /dev/null > Packages
        sudo gzip -fk Packages

    - name: Upload Artifacts to GitHub Actions UX
      uses: actions/upload-artifact@v4
      with:
        # Bổ sung mã hiệu kiến trúc và cờ tối ưu hóa để phân tách tên file duy nhất, triệt tiêu lỗi 409
        name: ${{ matrix.name }}-${{ matrix.v }}-${{ matrix.flag }}
        path: dist-package/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-${{ matrix.v }}-${{ matrix.flag }}
        path: dist-package/
